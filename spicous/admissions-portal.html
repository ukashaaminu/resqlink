<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registrar — Admissions Portal</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root{
    --ink:#14213D;
    --ink-2:#1E2E52;
    --paper:#FBFAF7;
    --paper-2:#F3F1EA;
    --gold:#C9972C;
    --gold-dark:#9C7420;
    --slate:#5B6472;
    --line:#DAD6C9;
    --good:#2F6E4F;
    --good-bg:#E7F1EB;
    --bad:#B3432B;
    --bad-bg:#F7E8E2;
    --wait:#8A6D1E;
    --wait-bg:#F5EEDA;
    --radius:10px;
    --shadow: 0 1px 2px rgba(20,33,61,0.06), 0 8px 24px rgba(20,33,61,0.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  h1,h2,h3,.serif{font-family:'Fraunces',serif;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;}
  ::selection{background:var(--gold);color:#fff;}

  /* ---------- Top bar ---------- */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 24px;border-bottom:1px solid var(--line);
    background:var(--paper);position:sticky;top:0;z-index:50;
  }
  .brand{display:flex;align-items:center;gap:10px;font-family:'Fraunces',serif;font-weight:600;font-size:19px;letter-spacing:0.2px;}
  .brand .seal{
    width:30px;height:30px;border-radius:50%;
    background:var(--ink);color:var(--gold);
    display:flex;align-items:center;justify-content:center;
    font-family:'Fraunces',serif;font-size:14px;font-weight:700;
    border:1.5px solid var(--gold);
  }
  .top-actions{display:flex;gap:10px;align-items:center;font-size:14px;color:var(--slate);}
  .pill-btn{
    border:1px solid var(--line);background:#fff;color:var(--ink);
    padding:8px 16px;border-radius:99px;font-size:13.5px;font-weight:600;
    transition:all .15s ease;
  }
  .pill-btn:hover{border-color:var(--ink);}
  .pill-btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink);}
  .pill-btn.primary:hover{background:var(--ink-2);}
  .pill-btn.ghost{border-color:transparent;background:transparent;}

  .wrap{max-width:1180px;margin:0 auto;padding:0 24px;}
  .hidden{display:none !important;}

  /* ---------- Landing ---------- */
  .hero{
    padding:64px 24px 40px;text-align:center;
    background:
      radial-gradient(circle at 15% 20%, rgba(201,151,44,0.08), transparent 40%),
      radial-gradient(circle at 85% 0%, rgba(20,33,61,0.05), transparent 45%);
  }
  .hero .eyebrow{
    font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--gold-dark);margin-bottom:14px;font-weight:600;
  }
  .hero h1{font-size:clamp(32px,5vw,52px);margin:0 0 14px;line-height:1.08;font-weight:600;}
  .hero p{color:var(--slate);max-width:520px;margin:0 auto 30px;font-size:16px;line-height:1.6;}
  .hero-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
  .btn-lg{padding:13px 26px;border-radius:99px;font-size:15px;font-weight:600;}

  .auth-card{
    max-width:420px;margin:8px auto 60px;background:#fff;border:1px solid var(--line);
    border-radius:var(--radius);box-shadow:var(--shadow);padding:32px;
  }
  .auth-tabs{display:flex;border:1px solid var(--line);border-radius:99px;padding:3px;margin-bottom:22px;background:var(--paper-2);}
  .auth-tabs button{flex:1;border:none;background:transparent;padding:9px;border-radius:99px;font-size:13.5px;font-weight:600;color:var(--slate);}
  .auth-tabs button.active{background:var(--ink);color:var(--paper);}
  .field{margin-bottom:14px;text-align:left;}
  .field label{display:block;font-size:12.5px;font-weight:600;color:var(--slate);margin-bottom:6px;letter-spacing:.02em;}
  .field input,.field select,.field textarea{
    width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:7px;
    font-size:14.5px;font-family:inherit;background:var(--paper);color:var(--ink);
  }
  .field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--gold);outline-offset:1px;border-color:var(--gold);}
  .field textarea{resize:vertical;min-height:70px;}
  .full-btn{width:100%;padding:12px;border-radius:8px;border:none;background:var(--ink);color:var(--paper);font-weight:600;font-size:14.5px;}
  .full-btn:hover{background:var(--ink-2);}
  .msg{font-size:13px;padding:9px 12px;border-radius:7px;margin-bottom:14px;}
  .msg.err{background:var(--bad-bg);color:var(--bad);}
  .msg.ok{background:var(--good-bg);color:var(--good);}
  .switch-line{text-align:center;font-size:13px;color:var(--slate);margin-top:16px;}
  .switch-line button{background:none;border:none;color:var(--gold-dark);font-weight:600;text-decoration:underline;font-size:13px;padding:0;}

  .admin-link{text-align:center;margin-top:22px;font-size:12.5px;color:var(--slate);}
  .admin-link button{background:none;border:none;color:var(--slate);text-decoration:underline;font-size:12.5px;}

  /* ---------- App shell (dashboards) ---------- */
  .shell{display:flex;min-height:calc(100vh - 65px);}
  .sidebar{
    width:220px;flex-shrink:0;border-right:1px solid var(--line);
    padding:24px 14px;background:var(--paper-2);
  }
  .sidebar .who{padding:0 10px 18px;border-bottom:1px solid var(--line);margin-bottom:14px;}
  .sidebar .who .name{font-weight:600;font-size:14.5px;}
  .sidebar .who .role{font-size:12px;color:var(--slate);margin-top:2px;}
  .nav-item{
    display:flex;align-items:center;gap:9px;width:100%;text-align:left;border:none;background:none;
    padding:10px 12px;border-radius:8px;font-size:14px;font-weight:500;color:var(--ink);margin-bottom:2px;
  }
  .nav-item:hover{background:#fff;}
  .nav-item.active{background:var(--ink);color:var(--paper);font-weight:600;}
  .main{flex:1;padding:32px;min-width:0;}
  .main h2{margin:0 0 4px;font-size:26px;}
  .subtitle{color:var(--slate);font-size:14px;margin-bottom:26px;}

  /* mobile nav */
  .mobile-tabs{display:none;}

  /* ---------- Cards / status ---------- */
  .card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);margin-bottom:20px;}
  .status-badge{
    display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:99px;
    font-size:12.5px;font-weight:600;font-family:'IBM Plex Mono',monospace;
  }
  .status-badge.pending{background:var(--wait-bg);color:var(--wait);}
  .status-badge.approved{background:var(--good-bg);color:var(--good);}
  .status-badge.rejected{background:var(--bad-bg);color:var(--bad);}
  .status-badge::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;}

  .ledger-row{
    display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px dashed var(--line);
    font-size:14px;
  }
  .ledger-row:last-child{border-bottom:none;}
  .ledger-row .k{color:var(--slate);}
  .ledger-row .v{font-weight:600;font-family:'IBM Plex Mono',monospace;}

  .admission-number{
    display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:600;
    background:var(--ink);color:var(--gold);padding:8px 16px;border-radius:6px;letter-spacing:.05em;
    border:1.5px dashed var(--gold);
  }

  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{text-align:left;color:var(--slate);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em;
     padding:10px 12px;border-bottom:2px solid var(--ink);white-space:nowrap;}
  td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle;}
  tr:hover td{background:var(--paper-2);}
  .table-scroll{overflow-x:auto;}
  .small-btn{
    padding:6px 12px;border-radius:6px;border:1px solid var(--line);background:#fff;font-size:12.5px;font-weight:600;margin-right:4px;
  }
  .small-btn.approve{border-color:var(--good);color:var(--good);}
  .small-btn.approve:hover{background:var(--good-bg);}
  .small-btn.reject{border-color:var(--bad);color:var(--bad);}
  .small-btn.reject:hover{background:var(--bad-bg);}
  .small-btn.gold{border-color:var(--gold-dark);color:var(--gold-dark);}
  .small-btn.gold:hover{background:#FBF3E1;}

  .empty{padding:40px 20px;text-align:center;color:var(--slate);font-size:14px;}
  .empty .big{font-size:34px;margin-bottom:8px;}

  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .stat{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;}
  .stat .n{font-family:'Fraunces',serif;font-size:30px;font-weight:600;}
  .stat .l{font-size:12.5px;color:var(--slate);text-transform:uppercase;letter-spacing:.04em;margin-top:2px;}
  .stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px;}

  /* ---------- Slip ---------- */
  .slip{
    background:#fff;border:1px solid var(--ink);position:relative;padding:36px;max-width:560px;margin:0 auto;
  }
  .slip::before{
    content:'';position:absolute;inset:8px;border:1px dashed var(--gold-dark);pointer-events:none;
  }
  .slip-head{text-align:center;border-bottom:2px solid var(--ink);padding-bottom:16px;margin-bottom:20px;}
  .slip-head .seal{width:44px;height:44px;margin:0 auto 10px;border-radius:50%;background:var(--ink);color:var(--gold);
    display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-weight:700;font-size:18px;border:2px solid var(--gold);}
  .slip-head h3{margin:0;font-size:20px;}
  .slip-head .sub{font-size:12px;color:var(--slate);letter-spacing:.06em;text-transform:uppercase;margin-top:4px;}
  .stamp{
    position:absolute;top:30px;right:30px;transform:rotate(8deg);
    border:2.5px solid var(--good);color:var(--good);font-family:'IBM Plex Mono',monospace;
    font-weight:700;font-size:12px;padding:6px 10px;border-radius:6px;letter-spacing:.05em;opacity:0.85;
  }
  @media print{
    body *{visibility:hidden;}
    .slip,.slip *{visibility:visible;}
    .slip{position:absolute;top:0;left:0;width:100%;box-shadow:none;border:none;}
    .no-print{display:none !important;}
  }

  /* ---------- Responsive ---------- */
  @media (max-width:820px){
    .shell{flex-direction:column;}
    .sidebar{display:none;}
    .mobile-tabs{
      display:flex;overflow-x:auto;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line);
      background:var(--paper-2);position:sticky;top:65px;z-index:40;
    }
    .mobile-tabs button{
      flex-shrink:0;border:none;background:#fff;border:1px solid var(--line);padding:8px 14px;border-radius:99px;
      font-size:13px;font-weight:600;color:var(--ink);
    }
    .mobile-tabs button.active{background:var(--ink);color:var(--paper);border-color:var(--ink);}
    .main{padding:20px 16px;}
    .grid-2{grid-template-columns:1fr;}
    .stat-row{grid-template-columns:1fr 1fr;}
    .topbar{padding:14px 16px;}
    .brand{font-size:16px;}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand"><span class="seal">A</span> Registrar</div>
  <div class="top-actions" id="topActions"></div>
</div>

<!-- LANDING -->
<div id="view-landing">
  <div class="hero">
    <div class="eyebrow">Admissions · Open Now</div>
    <h1>Apply. Track. Enrol.</h1>
    <p>Submit your application, follow it through review, and get your admission number the moment a decision is made — all in one place.</p>
  </div>
  <div class="auth-card">
    <div class="auth-tabs">
      <button id="tabLogin" class="active" onclick="setAuthTab('login')">Log in</button>
      <button id="tabSignup" onclick="setAuthTab('signup')">Sign up</button>
    </div>
    <div id="authMsg"></div>

    <form id="loginForm" onsubmit="return doLogin(event)">
      <div class="field"><label>Email</label><input type="email" id="loginEmail" required></div>
      <div class="field"><label>Password</label><input type="password" id="loginPassword" required></div>
      <button class="full-btn" type="submit">Log in</button>
    </form>

    <form id="signupForm" class="hidden" onsubmit="return doSignup(event)">
      <div class="field"><label>Full name</label><input type="text" id="suName" required></div>
      <div class="field"><label>Email</label><input type="email" id="suEmail" required></div>
      <div class="field"><label>Password</label><input type="password" id="suPassword" required minlength="4"></div>
      <button class="full-btn" type="submit">Create account</button>
    </form>

    <div class="switch-line" id="switchLine"></div>
    <div class="admin-link"><button onclick="showAdminLogin()">Staff / Registrar login →</button></div>
  </div>
</div>

<!-- ADMIN LOGIN MODAL-ish -->
<div id="view-adminlogin" class="hidden">
  <div class="auth-card" style="margin-top:80px;">
    <h3 style="margin-top:0;text-align:center;">Registrar Access</h3>
    <div id="adminMsg"></div>
    <form onsubmit="return doAdminLogin(event)">
      <div class="field"><label>Access code</label><input type="password" id="adminCode" required></div>
      <button class="full-btn" type="submit">Enter dashboard</button>
    </form>
    <div class="switch-line"><button onclick="showLanding()">← Back</button></div>
  </div>
</div>

<!-- STUDENT SHELL -->
<div id="view-student" class="hidden">
  <div class="mobile-tabs" id="studentMobileTabs"></div>
  <div class="shell">
    <div class="sidebar" id="studentSidebar"></div>
    <div class="main" id="studentMain"></div>
  </div>
</div>

<!-- ADMIN SHELL -->
<div id="view-admin" class="hidden">
  <div class="mobile-tabs" id="adminMobileTabs"></div>
  <div class="shell">
    <div class="sidebar" id="adminSidebar"></div>
    <div class="main" id="adminMain"></div>
  </div>
</div>

<script>
/* ================= CONFIG ================= */
const ADMIN_CODE = "REGISTRAR2026"; // change this before real use
const SHARED = true; // all data shared across students/admin

/* ================= STATE ================= */
let students = [], applications = [], courses = [], results = [];
let session = { role: null, studentId: null }; // role: 'student' | 'admin'
let studentTab = 'apply';
let adminTab = 'overview';

/* ================= STORAGE ================= */
async function loadAll(){
  students = await getOr('students', []);
  applications = await getOr('applications', []);
  courses = await getOr('courses', []);
  results = await getOr('results', []);
}
async function getOr(key, fallback){
  try{
    const r = await window.storage.get(key, SHARED);
    return r ? JSON.parse(r.value) : fallback;
  }catch(e){ return fallback; }
}
async function persist(key, value){
  try{ await window.storage.set(key, JSON.stringify(value), SHARED); }
  catch(e){ console.error('storage error', e); alert('Could not save — please try again.'); }
}
const saveStudents = () => persist('students', students);
const saveApplications = () => persist('applications', applications);
const saveCourses = () => persist('courses', courses);
const saveResults = () => persist('results', results);

/* ================= HELPERS ================= */
function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4); }
function esc(s){ return (s||'').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDate(iso){ return new Date(iso).toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'}); }
function findApp(studentId){ return applications.find(a=>a.studentId===studentId); }
function genAdmissionNumber(){
  const year = new Date().getFullYear();
  const count = applications.filter(a=>a.admissionNumber).length + 1;
  return `ADM/${year}/${String(count).padStart(4,'0')}`;
}

/* ================= AUTH VIEWS ================= */
function setAuthTab(tab){
  document.getElementById('tabLogin').classList.toggle('active', tab==='login');
  document.getElementById('tabSignup').classList.toggle('active', tab==='signup');
  document.getElementById('loginForm').classList.toggle('hidden', tab!=='login');
  document.getElementById('signupForm').classList.toggle('hidden', tab!=='signup');
  document.getElementById('authMsg').innerHTML = '';
  document.getElementById('switchLine').innerHTML = tab==='login'
    ? `New here? <button onclick="setAuthTab('signup')">Create an account</button>`
    : `Already registered? <button onclick="setAuthTab('login')">Log in</button>`;
}
function showLanding(){
  session = {role:null, studentId:null};
  hideAll();
  document.getElementById('view-landing').classList.remove('hidden');
  setAuthTab('login');
  renderTopbar();
}
function showAdminLogin(){
  hideAll();
  document.getElementById('view-adminlogin').classList.remove('hidden');
}
function hideAll(){
  ['view-landing','view-adminlogin','view-student','view-admin'].forEach(id=>document.getElementById(id).classList.add('hidden'));
}

async function doSignup(e){
  e.preventDefault();
  const name = document.getElementById('suName').value.trim();
  const email = document.getElementById('suEmail').value.trim().toLowerCase();
  const password = document.getElementById('suPassword').value;
  const msgEl = document.getElementById('authMsg');
  if(students.find(s=>s.email===email)){
    msgEl.innerHTML = `<div class="msg err">An account with this email already exists.</div>`;
    return false;
  }
  const student = { id: uid(), name, email, password, createdAt: new Date().toISOString() };
  students.push(student);
  await saveStudents();
  session = {role:'student', studentId: student.id};
  studentTab = 'apply';
  renderStudent();
  return false;
}
async function doLogin(e){
  e.preventDefault();
  const email = document.getElementById('loginEmail').value.trim().toLowerCase();
  const password = document.getElementById('loginPassword').value;
  const msgEl = document.getElementById('authMsg');
  const s = students.find(x=>x.email===email && x.password===password);
  if(!s){
    msgEl.innerHTML = `<div class="msg err">Incorrect email or password.</div>`;
    return false;
  }
  session = {role:'student', studentId: s.id};
  studentTab = findApp(s.id) ? 'status' : 'apply';
  renderStudent();
  return false;
}
function doAdminLogin(e){
  e.preventDefault();
  const code = document.getElementById('adminCode').value;
  const msgEl = document.getElementById('adminMsg');
  if(code !== ADMIN_CODE){
    msgEl.innerHTML = `<div class="msg err">Invalid access code.</div>`;
    return false;
  }
  session = {role:'admin', studentId:null};
  adminTab = 'overview';
  renderAdmin();
  return false;
}
function logout(){ showLanding(); }

function renderTopbar(){
  const el = document.getElementById('topActions');
  if(session.role==='student'){
    const s = students.find(x=>x.id===session.studentId);
    el.innerHTML = `<span>${esc(s?.name||'')}</span> <button class="pill-btn" onclick="logout()">Log out</button>`;
  } else if(session.role==='admin'){
    el.innerHTML = `<span>Registrar</span> <button class="pill-btn" onclick="logout()">Log out</button>`;
  } else {
    el.innerHTML = '';
  }
}

/* ================= STUDENT DASHBOARD ================= */
function studentNavItems(){
  const app = findApp(session.studentId);
  const items = [{key:'apply', label:'Application', icon:'📝'}];
  if(app) items.push({key:'status', label:'Status & Admission', icon:'🎓'});
  if(app && app.status==='approved') items.push({key:'payment', label:'Payment', icon:'💳'});
  if(app && app.status==='approved' && app.paymentStatus==='confirmed') items.push({key:'slip', label:'Confirmation Slip', icon:'🖨️'});
  if(app && app.status==='approved') items.push({key:'results', label:'My Results', icon:'📊'});
  return items;
}
function renderStudent(){
  hideAll();
  document.getElementById('view-student').classList.remove('hidden');
  renderTopbar();
  const items = studentNavItems();
  if(!items.find(i=>i.key===studentTab)) studentTab = 'apply';

  document.getElementById('studentSidebar').innerHTML = `
    <div class="who"><div class="name">${esc(students.find(s=>s.id===session.studentId)?.name||'')}</div><div class="role">Applicant</div></div>
    ${items.map(i=>`<button class="nav-item ${studentTab===i.key?'active':''}" onclick="setStudentTab('${i.key}')">${i.icon} ${i.label}</button>`).join('')}
  `;
  document.getElementById('studentMobileTabs').innerHTML = items.map(i=>
    `<button class="${studentTab===i.key?'active':''}" onclick="setStudentTab('${i.key}')">${i.label}</button>`).join('');

  const main = document.getElementById('studentMain');
  if(studentTab==='apply') main.innerHTML = renderApplyForm();
  else if(studentTab==='status') main.innerHTML = renderStatus();
  else if(studentTab==='payment') main.innerHTML = renderPaymentForm();
  else if(studentTab==='slip') main.innerHTML = renderSlip();
  else if(studentTab==='results') main.innerHTML = renderStudentResults();
}
function setStudentTab(tab){ studentTab = tab; renderStudent(); }

function renderApplyForm(){
  const app = findApp(session.studentId);
  if(app){
    return `<h2>Application submitted</h2><p class="subtitle">Your application is on file — check its status below.</p>
    <div class="card"><div class="ledger-row"><span class="k">Reference</span><span class="v">${app.id}</span></div>
    <div class="ledger-row"><span class="k">Submitted</span><span class="v">${fmtDate(app.createdAt)}</span></div>
    <div class="ledger-row"><span class="k">Status</span><span class="status-badge ${app.status}">${app.status}</span></div></div>
    <button class="pill-btn primary" onclick="setStudentTab('status')">View full status →</button>`;
  }
  const courseOpts = courses.length
    ? courses.map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('')
    : `<option value="">No programmes open yet</option>`;
  return `
  <h2>Screening & Application Form</h2>
  <p class="subtitle">Fill this in carefully — it's reviewed by the admissions team.</p>
  <div class="card">
    <form onsubmit="return submitApplication(event)">
      <div class="grid-2">
        <div class="field"><label>Date of birth</label><input type="date" id="fDob" required></div>
        <div class="field"><label>Gender</label><select id="fGender" required><option value="">Select</option><option>Female</option><option>Male</option><option>Other</option><option>Prefer not to say</option></select></div>
      </div>
      <div class="field"><label>Phone number</label><input type="tel" id="fPhone" required></div>
      <div class="field"><label>Home address</label><textarea id="fAddress" required></textarea></div>
      <div class="grid-2">
        <div class="field"><label>Previous school</label><input type="text" id="fPrevSchool" required></div>
        <div class="field"><label>Previous grade / result</label><input type="text" id="fPrevGrade" required></div>
      </div>
      <div class="field"><label>Programme applying for</label><select id="fCourse">${courseOpts}</select></div>
      <div class="field"><label>Statement of purpose</label><textarea id="fStatement" placeholder="Why do you want to join this programme?" required></textarea></div>
      <button class="full-btn" type="submit">Submit application</button>
    </form>
  </div>`;
}
async function submitApplication(e){
  e.preventDefault();
  const app = {
    id: 'APP-' + uid().toUpperCase(),
    studentId: session.studentId,
    dob: document.getElementById('fDob').value,
    gender: document.getElementById('fGender').value,
    phone: document.getElementById('fPhone').value,
    address: document.getElementById('fAddress').value,
    prevSchool: document.getElementById('fPrevSchool').value,
    prevGrade: document.getElementById('fPrevGrade').value,
    courseId: document.getElementById('fCourse').value || null,
    statement: document.getElementById('fStatement').value,
    status: 'pending',
    admissionNumber: null,
    paymentStatus: 'not_required',
    paymentRef: null,
    createdAt: new Date().toISOString(),
    decidedAt: null,
    rejectReason: null
  };
  applications.push(app);
  await saveApplications();
  studentTab = 'status';
  renderStudent();
  return false;
}
function renderStatus(){
  const app = findApp(session.studentId);
  if(!app) return `<div class="empty"><div class="big">📭</div>No application on file yet.</div>`;
  const course = courses.find(c=>c.id===app.courseId);
  return `
  <h2>Application Status</h2>
  <p class="subtitle">Reference ${app.id}</p>
  <div class="card">
    <div class="ledger-row"><span class="k">Status</span><span class="status-badge ${app.status}">${app.status}</span></div>
    <div class="ledger-row"><span class="k">Programme</span><span class="v">${esc(course?.name||'—')}</span></div>
    <div class="ledger-row"><span class="k">Submitted</span><span class="v">${fmtDate(app.createdAt)}</span></div>
    ${app.decidedAt ? `<div class="ledger-row"><span class="k">Decided</span><span class="v">${fmtDate(app.decidedAt)}</span></div>`:''}
    ${app.status==='rejected' && app.rejectReason ? `<div class="ledger-row"><span class="k">Reason</span><span class="v">${esc(app.rejectReason)}</span></div>`:''}
  </div>
  ${app.status==='approved' ? `
  <div class="card">
    <h3 style="margin-top:0;">🎓 Admission Number</h3>
    <div class="admission-number">${app.admissionNumber}</div>
    <p class="subtitle" style="margin-top:14px;margin-bottom:0;">Congratulations — you've been admitted. Complete payment next to receive your confirmation slip.</p>
  </div>` : ''}
  ${app.status==='pending' ? `<div class="card"><p style="margin:0;color:var(--slate);">Your application is under review. This page updates automatically once a decision is made.</p></div>` : ''}
  `;
}
function renderPaymentForm(){
  const app = findApp(session.studentId);
  if(!app || app.status!=='approved') return `<div class="empty">Payment opens after approval.</div>`;
  if(app.paymentStatus==='confirmed'){
    return `<h2>Payment</h2><div class="card"><div class="ledger-row"><span class="k">Status</span><span class="status-badge approved">confirmed</span></div>
    <div class="ledger-row"><span class="k">Reference submitted</span><span class="v">${esc(app.paymentRef)}</span></div></div>
    <p class="subtitle">Payment confirmed by the registrar. Your confirmation slip is ready.</p>
    <button class="pill-btn primary" onclick="setStudentTab('slip')">Go to confirmation slip →</button>`;
  }
  if(app.paymentStatus==='submitted'){
    return `<h2>Payment</h2><div class="card"><div class="ledger-row"><span class="k">Status</span><span class="status-badge pending">awaiting confirmation</span></div>
    <div class="ledger-row"><span class="k">Reference submitted</span><span class="v">${esc(app.paymentRef)}</span></div></div>
    <p class="subtitle">The registrar's office is confirming your payment. This can take a short while.</p>`;
  }
  return `
  <h2>Admission Payment</h2>
  <p class="subtitle">Make payment through your institution's official channel, then record the reference below for confirmation.</p>
  <div class="card">
    <form onsubmit="return submitPayment(event)">
      <div class="field"><label>Payment reference / transaction ID</label><input type="text" id="fPayRef" required placeholder="e.g. TXN-8834211"></div>
      <button class="full-btn" type="submit">Submit for confirmation</button>
    </form>
  </div>`;
}
async function submitPayment(e){
  e.preventDefault();
  const app = findApp(session.studentId);
  app.paymentRef = document.getElementById('fPayRef').value.trim();
  app.paymentStatus = 'submitted';
  await saveApplications();
  renderStudent();
  return false;
}
function renderSlip(){
  const app = findApp(session.studentId);
  const s = students.find(x=>x.id===session.studentId);
  if(!app || app.status!=='approved' || app.paymentStatus!=='confirmed') return `<div class="empty">Slip not available yet.</div>`;
  const course = courses.find(c=>c.id===app.courseId);
  return `
  <h2>Confirmation Slip</h2>
  <p class="subtitle no-print">This is your official admission confirmation — print or save it for your records.</p>
  <div class="slip">
    <div class="stamp">CONFIRMED</div>
    <div class="slip-head">
      <div class="seal">A</div>
      <h3>Admission Confirmation Slip</h3>
      <div class="sub">Office of the Registrar</div>
    </div>
    <div class="ledger-row"><span class="k">Applicant</span><span class="v">${esc(s.name)}</span></div>
    <div class="ledger-row"><span class="k">Admission No.</span><span class="v">${app.admissionNumber}</span></div>
    <div class="ledger-row"><span class="k">Programme</span><span class="v">${esc(course?.name||'—')}</span></div>
    <div class="ledger-row"><span class="k">Application Ref</span><span class="v">${app.id}</span></div>
    <div class="ledger-row"><span class="k">Payment Ref</span><span class="v">${esc(app.paymentRef)}</span></div>
    <div class="ledger-row"><span class="k">Issued</span><span class="v">${fmtDate(new Date().toISOString())}</span></div>
  </div>
  <div style="text-align:center;margin-top:22px;" class="no-print">
    <button class="pill-btn primary" onclick="window.print()">🖨️ Print slip</button>
  </div>`;
}
function renderStudentResults(){
  const app = findApp(session.studentId);
  const mine = results.filter(r=>r.studentId===session.studentId);
  if(!app || app.status!=='approved') return `<div class="empty">Results appear here once admitted.</div>`;
  if(!mine.length) return `<div class="empty"><div class="big">📊</div>No results uploaded yet.</div>`;
  return `<h2>My Results</h2><div class="card"><div class="table-scroll"><table>
    <tr><th>Course</th><th>Score</th><th>Grade</th></tr>
    ${mine.map(r=>{const c=courses.find(c=>c.id===r.courseId);
      return `<tr><td>${esc(c?.name||'—')}</td><td>${esc(r.score)}</td><td>${esc(r.grade)}</td></tr>`;}).join('')}
  </table></div></div>`;
}

/* ================= ADMIN DASHBOARD ================= */
const adminItems = [
  {key:'overview', label:'Overview', icon:'📋'},
  {key:'applicants', label:'Applicants', icon:'🗂️'},
  {key:'payments', label:'Payments', icon:'💳'},
  {key:'courses', label:'Courses', icon:'📚'},
  {key:'results', label:'Results Upload', icon:'📊'},
];
function renderAdmin(){
  hideAll();
  document.getElementById('view-admin').classList.remove('hidden');
  renderTopbar();
  document.getElementById('adminSidebar').innerHTML = `
    <div class="who"><div class="name">Registrar</div><div class="role">Administrator</div></div>
    ${adminItems.map(i=>`<button class="nav-item ${adminTab===i.key?'active':''}" onclick="setAdminTab('${i.key}')">${i.icon} ${i.label}</button>`).join('')}
  `;
  document.getElementById('adminMobileTabs').innerHTML = adminItems.map(i=>
    `<button class="${adminTab===i.key?'active':''}" onclick="setAdminTab('${i.key}')">${i.label}</button>`).join('');

  const main = document.getElementById('adminMain');
  if(adminTab==='overview') main.innerHTML = renderAdminOverview();
  else if(adminTab==='applicants') main.innerHTML = renderAdminApplicants();
  else if(adminTab==='payments') main.innerHTML = renderAdminPayments();
  else if(adminTab==='courses') main.innerHTML = renderAdminCourses();
  else if(adminTab==='results') main.innerHTML = renderAdminResults();
  if(adminTab==='courses') attachCourseHandlers();
}
function setAdminTab(tab){ adminTab = tab; renderAdmin(); }

function renderAdminOverview(){
  const pending = applications.filter(a=>a.status==='pending').length;
  const approved = applications.filter(a=>a.status==='approved').length;
  const rejected = applications.filter(a=>a.status==='rejected').length;
  const paid = applications.filter(a=>a.paymentStatus==='confirmed').length;
  return `
  <h2>Overview</h2><p class="subtitle">Live snapshot of the admissions cycle.</p>
  <div class="stat-row">
    <div class="stat"><div class="n">${applications.length}</div><div class="l">Total Applications</div></div>
    <div class="stat"><div class="n">${pending}</div><div class="l">Pending Review</div></div>
    <div class="stat"><div class="n">${approved}</div><div class="l">Approved</div></div>
    <div class="stat"><div class="n">${paid}</div><div class="l">Payments Confirmed</div></div>
  </div>
  <div class="card">
    <h3 style="margin-top:0;">Recent applications</h3>
    ${applications.length===0 ? `<div class="empty">No applications yet.</div>` : `
    <div class="table-scroll"><table>
    <tr><th>Applicant</th><th>Submitted</th><th>Status</th></tr>
    ${applications.slice().reverse().slice(0,6).map(a=>{
      const s = students.find(s=>s.id===a.studentId);
      return `<tr><td>${esc(s?.name||'—')}</td><td>${fmtDate(a.createdAt)}</td><td><span class="status-badge ${a.status}">${a.status}</span></td></tr>`;
    }).join('')}
    </table></div>`}
  </div>`;
}
function renderAdminApplicants(){
  if(!applications.length) return `<h2>Applicants</h2><div class="empty"><div class="big">🗂️</div>No applications submitted yet.</div>`;
  return `<h2>Applicants</h2><p class="subtitle">Review and decide on each application.</p>
  <div class="card"><div class="table-scroll"><table>
  <tr><th>Applicant</th><th>Programme</th><th>Submitted</th><th>Status</th><th>Admission No.</th><th>Action</th></tr>
  ${applications.slice().reverse().map(a=>{
    const s = students.find(s=>s.id===a.studentId);
    const c = courses.find(c=>c.id===a.courseId);
    return `<tr>
      <td>${esc(s?.name||'—')}<br><span style="color:var(--slate);font-size:12px;">${esc(s?.email||'')}</span></td>
      <td>${esc(c?.name||'—')}</td>
      <td>${fmtDate(a.createdAt)}</td>
      <td><span class="status-badge ${a.status}">${a.status}</span></td>
      <td>${a.admissionNumber ? `<span class="mono">${a.admissionNumber}</span>` : '—'}</td>
      <td>${a.status==='pending' ? `
        <button class="small-btn approve" onclick="decideApp('${a.id}','approved')">Approve</button>
        <button class="small-btn reject" onclick="decideApp('${a.id}','rejected')">Reject</button>
      ` : `<button class="small-btn gold" onclick="viewApp('${a.id}')">View</button>`}</td>
    </tr>`;
  }).join('')}
  </table></div></div>`;
}
async function decideApp(appId, decision){
  const app = applications.find(a=>a.id===appId);
  if(!app) return;
  if(decision==='rejected'){
    const reason = prompt('Reason for rejection (shown to applicant):','Did not meet programme requirements');
    app.status = 'rejected';
    app.rejectReason = reason || 'Not specified';
  } else {
    app.status = 'approved';
    app.admissionNumber = genAdmissionNumber();
    app.paymentStatus = 'pending';
  }
  app.decidedAt = new Date().toISOString();
  await saveApplications();
  renderAdmin();
}
function viewApp(appId){
  const a = applications.find(x=>x.id===appId);
  const s = students.find(s=>s.id===a.studentId);
  alert(
`Applicant: ${s.name} (${s.email})
Phone: ${a.phone}
Address: ${a.address}
Previous school: ${a.prevSchool}
Previous grade: ${a.prevGrade}
Statement: ${a.statement}
Status: ${a.status}${a.rejectReason ? '\nReason: '+a.rejectReason : ''}`
  );
}
function renderAdminPayments(){
  const relevant = applications.filter(a=>a.status==='approved');
  if(!relevant.length) return `<h2>Payments</h2><div class="empty">No approved applicants yet.</div>`;
  return `<h2>Payments</h2><p class="subtitle">Confirm payments submitted by admitted students.</p>
  <div class="card"><div class="table-scroll"><table>
  <tr><th>Applicant</th><th>Admission No.</th><th>Payment Ref</th><th>Status</th><th>Action</th></tr>
  ${relevant.map(a=>{
    const s = students.find(s=>s.id===a.studentId);
    return `<tr>
      <td>${esc(s?.name||'—')}</td>
      <td class="mono">${a.admissionNumber}</td>
      <td>${a.paymentRef ? esc(a.paymentRef) : '<span style="color:var(--slate);">not submitted</span>'}</td>
      <td><span class="status-badge ${a.paymentStatus==='confirmed'?'approved':a.paymentStatus==='submitted'?'pending':'rejected'}">${a.paymentStatus.replace('_',' ')}</span></td>
      <td>${a.paymentStatus==='submitted' ? `<button class="small-btn approve" onclick="confirmPayment('${a.id}')">Confirm</button>` : (a.paymentStatus==='confirmed' ? '✅' : '—')}</td>
    </tr>`;
  }).join('')}
  </table></div></div>`;
}
async function confirmPayment(appId){
  const app = applications.find(a=>a.id===appId);
  app.paymentStatus = 'confirmed';
  await saveApplications();
  renderAdmin();
}
function renderAdminCourses(){
  return `<h2>Courses</h2><p class="subtitle">Manage programmes open for admission.</p>
  <div class="card">
    <form id="courseForm">
      <div class="grid-2">
        <div class="field"><label>Course name</label><input type="text" id="cName" required></div>
        <div class="field"><label>Course code</label><input type="text" id="cCode" required></div>
      </div>
      <button class="full-btn" type="submit" style="width:auto;padding:10px 20px;">Add course</button>
    </form>
  </div>
  <div class="card">
    ${courses.length===0 ? `<div class="empty">No courses added yet.</div>` : `
    <div class="table-scroll"><table><tr><th>Name</th><th>Code</th><th></th></tr>
    ${courses.map(c=>`<tr><td>${esc(c.name)}</td><td class="mono">${esc(c.code)}</td>
    <td><button class="small-btn reject" onclick="removeCourse('${c.id}')">Remove</button></td></tr>`).join('')}
    </table></div>`}
  </div>`;
}
function attachCourseHandlers(){
  const f = document.getElementById('courseForm');
  if(f) f.onsubmit = async (e) => {
    e.preventDefault();
    courses.push({id: uid(), name: document.getElementById('cName').value.trim(), code: document.getElementById('cCode').value.trim()});
    await saveCourses();
    renderAdmin();
  };
}
async function removeCourse(id){
  courses = courses.filter(c=>c.id!==id);
  await saveCourses();
  renderAdmin();
}
function renderAdminResults(){
  const admitted = applications.filter(a=>a.status==='approved');
  if(!admitted.length) return `<h2>Results Upload</h2><div class="empty">No admitted students yet.</div>`;
  if(!courses.length) return `<h2>Results Upload</h2><div class="empty">Add a course first, under Courses.</div>`;
  return `<h2>Results Upload</h2><p class="subtitle">Enter examination results for admitted students.</p>
  <div class="card">
    <form id="resultForm">
      <div class="grid-2">
        <div class="field"><label>Student</label><select id="rStudent" required>
          ${admitted.map(a=>{const s=students.find(s=>s.id===a.studentId);return `<option value="${a.studentId}">${esc(s.name)} (${a.admissionNumber})</option>`;}).join('')}
        </select></div>
        <div class="field"><label>Course</label><select id="rCourse" required>
          ${courses.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}
        </select></div>
      </div>
      <div class="grid-2">
        <div class="field"><label>Score</label><input type="number" id="rScore" min="0" max="100" required></div>
        <div class="field"><label>Grade</label><input type="text" id="rGrade" required placeholder="e.g. A"></div>
      </div>
      <button class="full-btn" type="submit" style="width:auto;padding:10px 20px;">Upload result</button>
    </form>
  </div>
  <div class="card">
    ${results.length===0 ? `<div class="empty">No results uploaded yet.</div>` : `
    <div class="table-scroll"><table><tr><th>Student</th><th>Course</th><th>Score</th><th>Grade</th></tr>
    ${results.slice().reverse().map(r=>{
      const s = students.find(s=>s.id===r.studentId);
      const c = courses.find(c=>c.id===r.courseId);
      return `<tr><td>${esc(s?.name||'—')}</td><td>${esc(c?.name||'—')}</td><td>${esc(r.score)}</td><td>${esc(r.grade)}</td></tr>`;
    }).join('')}
    </table></div>`}
  </div>`;
}
document.addEventListener('submit', function(e){
  if(e.target && e.target.id==='resultForm'){
    e.preventDefault();
    results.push({
      id: uid(),
      studentId: document.getElementById('rStudent').value,
      courseId: document.getElementById('rCourse').value,
      score: document.getElementById('rScore').value,
      grade: document.getElementById('rGrade').value.trim()
    });
    saveResults().then(renderAdmin);
  }
}, true);

/* ================= INIT ================= */
(async function init(){
  await loadAll();
  showLanding();
})();
</script>
</body>
</html>
